plugins {
	id 'fabric-loom' version '1.17.18'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// The dev client runs on vanilla OpenGL unless told otherwise:
//   ./gradlew runClient
//   ./gradlew runClient -Pdev_renderer=sodium
//   ./gradlew runClient -Pdev_renderer=vulkanmod
// Sodium and VulkanMod both replace the terrain renderer and cannot be loaded together.
def devRenderer = findProperty('dev_renderer') ?: 'vanilla'

def lwjglNatives = {
	def os = System.getProperty('os.name').toLowerCase()
	def arm = System.getProperty('os.arch').contains('aarch64')
	if (os.contains('win')) return 'natives-windows'
	if (os.contains('mac')) return arm ? 'natives-macos-arm64' : 'natives-macos'
	return 'natives-linux'
}()

loom {
	runs {
		client {
			// The second window only opens once a world is loaded, so go straight into one.
			programArgs '--quickPlaySingleplayer', 'New World'
		}
	}
}

repositories {
	mavenCentral()
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = uri('https://api.modrinth.com/maven')
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation "maven.modrinth:walksylib:${project.walksylib_version}"

	// Sodium and VulkanMod are not dependencies of the built jar. They are compiled against for
	// their patches, which are only applied when the mod they patch is installed.
	modCompileOnly "maven.modrinth:sodium:${project.sodium_version}"
	modCompileOnly "maven.modrinth:vulkanmod:${project.vulkanmod_version}"
	compileOnly "org.lwjgl:lwjgl-vulkan:${project.lwjgl_version}"
	if (devRenderer == 'sodium') {
		modLocalRuntime "maven.modrinth:sodium:${project.sodium_version}"
	}
	if (devRenderer == 'vulkanmod') {
		modLocalRuntime "maven.modrinth:vulkanmod:${project.vulkanmod_version}"
		// VulkanMod ships these inside its jar, where Fabric Loader finds them in a real install.
		// The dev client does not unpack nested jars onto its classpath, so name them here.
		['lwjgl-vulkan', 'lwjgl-vma', 'lwjgl-shaderc'].each {
			localRuntime "org.lwjgl:${it}:${project.lwjgl_version}"
		}
		['lwjgl-vma', 'lwjgl-shaderc'].each {
			localRuntime "org.lwjgl:${it}:${project.lwjgl_version}:${lwjglNatives}"
		}
	}
}

processResources {
	inputs.property 'version', project.version
	filesMatching('fabric.mod.json') {
		expand 'version': project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
